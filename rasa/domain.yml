# ─── Responses ────────────────────────────────────────────────────────────────

responses:
  utter_greet:
    - text: "Hello! I'm the FDD Bot. I'll guide you through building your due diligence output. Let's start."

  utter_reset_confirm:
    - text: "All settings have been reset. You can start a new conversation."

  utter_default:
    - text: "I didn't quite understand that. Please use the buttons or form inputs to respond."

  utter_main_welcome:
    - custom:
        type: adaptive_card
        card: "main_welcome"
        title: "Project Setup"
        subtitle: "Let's set up the basic project information."
        inputs:
          - id: project_name
            type: text
            label: "What is the project's name?"
            placeholder: "e.g. Project COOP"
            required: true
          - id: group_name
            type: text
            label: "What is the group's name?"
            placeholder: "e.g. WorkwithUs Group"
            required: true
        submit_label: "Continue"

  utter_ask_dates:
    - custom:
        type: adaptive_card
        card: "dates"
        compact: true
        title: "Date Settings"
        inputs:
          - id: ltm_month
            type: month_picker
            span: 2
            label: "Last month to include (as-of timestamp for LTM and YTD calculations)"
            required: true
          - id: fy_end_month
            type: dropdown
            label: "FY end — month"
            rowGroup: fy_end
            required: true
            default: "12"
            options:
              - label: "January"
                value: "1"
              - label: "February"
                value: "2"
              - label: "March"
                value: "3"
              - label: "April"
                value: "4"
              - label: "May"
                value: "5"
              - label: "June"
                value: "6"
              - label: "July"
                value: "7"
              - label: "August"
                value: "8"
              - label: "September"
                value: "9"
              - label: "October"
                value: "10"
              - label: "November"
                value: "11"
              - label: "December"
                value: "12"
          - id: fy_end_day
            type: number
            label: "FY end — day"
            rowGroup: fy_end
            placeholder: "31"
            default: "31"
            required: true
          - id: first_fy
            type: number
            label: "Please provide the first financial year included in your data source"
            placeholder: "e.g. 2020"
            required: true
        submit_label: "Submit"

  utter_ask_upload_file:
    - custom:
        type: adaptive_card
        card: "file_upload"
        title: "Upload Sales Data"
        subtitle: "Please upload the Excel file containing the sales data."
        inputs:
          - id: file_upload
            type: file_drop
            label: "Drop your XLSX file here or click to browse"
            accept: ".xlsx"
            required: true
        submit_label: "Upload"

  utter_ask_sheet_name:
    - custom:
        type: adaptive_card
        card: "sheet_name"
        title: "Sheet Name"
        subtitle: "Please enter the name of the data sheet in your Excel file."
        inputs:
          - id: sheet_name
            type: text
            label: "What is the data sheet's name?"
            placeholder: "e.g. Database"
            required: true
        submit_label: "Continue"

  utter_ask_fx_rate:
    - custom:
        type: adaptive_card
        card: "fx_rate"
        title: "FX Rate"
        subtitle: "Apply an FX rate column to normalise currencies?"
        inputs:
          - id: apply_fx
            type: radio
            label: "Apply FX rate?"
            options:
              - label: "Yes"
                value: "yes"
              - label: "No"
                value: "no"
        submit_label: "Continue"

  utter_ask_desired_output:
    - custom:
        type: adaptive_card
        card: "desired_output"
        title: "Output Selection"
        subtitle: "What kind of output would you like to create?"
        inputs:
          - id: desired_output
            type: radio
            label: "Select output type"
            options:
              - label: "TOP Report"
                value: "top_report"
              - label: "PVM Analysis"
                value: "pvm_analysis"
              - label: "General Sales Table"
                value: "general_sales_table"
              - label: "Bubble Scatter Plot"
                value: "bubble_scatter"
        submit_label: "Continue"

  utter_ask_build_databook:
    - custom:
        type: adaptive_card
        card: "build_databook"
        title: "Select Output"
        subtitle: "What would you like to build?"
        inputs:
          - id: output_type
            type: radio
            label: "Choose output"
            options:
              - label: "Databook"
                value: "databook"
              - label: "Revenue Databook"
                value: "revenue_databook"
              - label: "Creditor / Debitor Aging"
                value: "creditor_debitor_aging"
              - label: "FTE Development"
                value: "fte_development"
        submit_label: "Continue"

  utter_processing:
    - text: "Please wait while your data files are being processed... ⏳"

  utter_gst_intro:
    - text: "Great! Let's configure the General Sales Table."

  utter_pvm_intro:
    - text: "Great! Let's configure the PVM Analysis."

  utter_top_intro:
    - text: "Great! Let's configure the TOP Report."

  utter_databook_intro:
    - text: "Let's set up the Databook. You'll choose how your trial balances are organised, upload files, then confirm how they should be read."

  utter_output_next_steps:
    - custom:
        type: adaptive_card
        card: "next_action"
        title: "Output Complete"
        subtitle: "Your output has been generated successfully. What would you like to do next?"
        inputs:
          - id: next_action
            type: radio
            label: "Next action"
            options:
              - label: "Create another output"
                value: "create_another"
              - label: "Change settings and regenerate"
                value: "change_settings"
              - label: "Restart the full guided conversation"
                value: "restart"
              - label: "Change only the filters"
                value: "change_filters"
        submit_label: "Continue"

