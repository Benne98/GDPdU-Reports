forms:
  main_form:
    required_slots:
      - project_name
      - group_name

  gst_form:
    required_slots:
      - gst_table_name
      - gst_invoice_mapping_mode
      - gst_calc_mode
      - gst_profit_mode
      - gst_revenue_col
      - gst_invoice_col
      - gst_group_col_1
      - gst_max_items_l1
      - gst_other_label_l1
      - gst_sort_mode

  pvm_form:
    required_slots:
      - pvm_group_col
      - pvm_period_mode
      - pvm_method
      - pvm_invoice_mapping_mode
      - pvm_profit_mode
      - pvm_revenue_col
      - pvm_invoice_col
      - pvm_quantity_col

  top_form:
    required_slots:
      - top_calc_mode
      - top_col
      - top_value_col
      - top_invoice_col
      - top_total_label
